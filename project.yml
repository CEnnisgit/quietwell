name: Quietwell
options:
  bundleIdPrefix: com.nimbuswebdesign
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
fileGroups:
  - Quietwell.storekit
  - README.md
targets:
  Quietwell:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Quietwell
    info:
      path: Quietwell/Info.plist
      properties:
        CFBundleDisplayName: Quietwell
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nimbuswebdesign.quietwell
        PRODUCT_NAME: Quietwell
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  QuietwellTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuietwellTests
    dependencies:
      - target: Quietwell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nimbuswebdesign.quietwell.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
schemes:
  Quietwell:
    build:
      targets:
        Quietwell: all
        QuietwellTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Quietwell.storekit
    test:
      config: Debug
      targets:
        - QuietwellTests
    archive:
      config: Release
